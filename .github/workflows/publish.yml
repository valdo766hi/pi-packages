---
name: Publish
run-name: Publish ${{ inputs.tag || github.ref_name }}

"on":
  push:
    tags:
      - "pi-*-*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example, pi-fast-0.1.3)
        required: true
        type: string

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag format
        shell: bash
        run: |
          pattern='^pi-[a-z0-9-]+-[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "$RELEASE_TAG" =~ $pattern ]]; then
            echo "Invalid release tag."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate release tag
        run: node scripts/resolve-release.mjs "$RELEASE_TAG"
      - name: Validate package and tag
        run: npm run check
      - name: Publish package
        id: package
        shell: bash
        run: |
          release="$(node scripts/resolve-release.mjs "$RELEASE_TAG")"
          workspace="$(node -p \
            'JSON.parse(process.argv[1]).workspace' "$release")"
          package_name="$(node -p \
            'JSON.parse(process.argv[1]).packageName' "$release")"
          version="$(node -p \
            'JSON.parse(process.argv[1]).version' "$release")"
          echo "Publishing ${package_name}@${version}"
          echo "package_name=${package_name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          npm publish --workspace="$workspace" --provenance --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ steps.package.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "${PACKAGE_NAME}@${PACKAGE_VERSION}" \
            --generate-notes
